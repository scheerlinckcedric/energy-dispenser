# Public example: electric space heater
# This is a simple persistent form consumer example.
# It is deliberately separate from the physical heater control.

# Configure in the Energy Dispenser UI:
#   consumer_id: example_space_heater
#   name: Space heater
#   minimum power: 500 W
#   preferred power: 1500 W
#   maximum power: 2000 W
#   urgency: 40 %
#   surplus value: 70 %
#   allow_import: false
#
# A separate processor can use:
#   sensor.budget_example_space_heater
# to control a relay, smart plug or thermostat.
