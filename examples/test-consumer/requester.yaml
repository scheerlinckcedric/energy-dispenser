# Harmless learning example: this request controls no physical device.

- alias: Example - Test consumer
  id: example_test_consumer
  mode: restart

  triggers:
    - trigger: time_pattern
      seconds: "/10"

  actions:
    - action: energy_dispenser.report
      data:
        consumer_id: example_test_consumer
        state: active
        minimum_power: 100
        preferred_power: 500
        maximum_power: 1000
        urgency: 0.2
        surplus_value: 1.0
        actual_power: 0
        settling_time: 0
        minimum_claim_time: 0
        report_timeout: 20
        allow_import: false
