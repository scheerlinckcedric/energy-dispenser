# Example EV processor contract
# The processor consumes sensor.budget_ev_auto and controls the physical EV.
# Keep the physical OCPP/device logic outside the Energy Dispenser integration.
# In Manual mode, use the existing slider/OCPP automation and do not overwrite
# number.charger_maximum_current from the budget processor.

# Intended semantics:
#   Niet laden                    -> Charge Control OFF
#   Manual                        -> Charge Control ON; preserve manual current
#   Laden met budget              -> budget / voltage -> amps; normal 6A start floor
#   Laden met budget, minimum 6A  -> budget / voltage -> amps; minimum 6A once active;
#                                   import is allowed and the processor never stops
#                                   an active session merely because the budget is low.
