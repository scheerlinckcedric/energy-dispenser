# Fixed 2000 W boiler processor. Adapt and validate this for your own hardware.

- alias: Example - Electric boiler processor
  id: example_electric_boiler_processor
  mode: restart

  triggers:
    - trigger: state
      entity_id:
        - sensor.budget_example_boiler
        - switch.example_boiler_relay

  actions:
    - choose:
        - conditions:
            - condition: numeric_state
              entity_id: sensor.budget_example_boiler
              above: 1999
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.example_boiler_relay
      default:
        - action: switch.turn_off
          target:
            entity_id: switch.example_boiler_relay
