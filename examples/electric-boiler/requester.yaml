# Fixed 2000 W boiler requester. It reports demand but does not control a relay.

- alias: Example - Electric boiler requester
  id: example_electric_boiler_requester
  mode: restart

  triggers:
    - trigger: time_pattern
      seconds: "/10"
    - trigger: state
      entity_id:
        - input_boolean.example_boiler_needs_heat
        - sensor.example_boiler_power

  variables:
    needs_heat: "{{ is_state('input_boolean.example_boiler_needs_heat', 'on') }}"
    actual_power: "{{ states('sensor.example_boiler_power') | float(0) }}"

  actions:
    - action: energy_dispenser.report
      data:
        consumer_id: example_boiler
        state: "{{ 'active' if needs_heat else 'inactive' }}"
        minimum_power: 2000
        preferred_power: 2000
        maximum_power: 2000
        urgency: 0.5
        surplus_value: 0.8
        actual_power: "{{ actual_power }}"
        settling_time: 10
        minimum_claim_time: 60
        report_timeout: 30
        allow_import: false
