<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#2878c8"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#f7fafc"/>
  <text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#15324b">Electric Boiler Example</text>
  <text x="600" y="88" text-anchor="middle" font-family="Arial" font-size="18" fill="#526675">Generic Energy Dispenser flow</text>

  <rect x="70" y="145" width="250" height="120" rx="18" fill="#fff4c2" stroke="#d9a900" stroke-width="3"/>
  <text x="195" y="190" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Solar / Grid</text>
  <text x="195" y="225" text-anchor="middle" font-family="Arial" font-size="18">power sensors</text>

  <rect x="455" y="135" width="290" height="145" rx="22" fill="#e8f3ff" stroke="#2878c8" stroke-width="4"/>
  <text x="600" y="180" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#145a98">Energy Dispenser</text>
  <text x="600" y="215" text-anchor="middle" font-family="Arial" font-size="18">available power + requests</text>
  <text x="600" y="245" text-anchor="middle" font-family="Arial" font-size="18">→ budget</text>

  <rect x="880" y="145" width="250" height="120" rx="18" fill="#e4f7e7" stroke="#3c9b50" stroke-width="3"/>
  <text x="1005" y="190" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Boiler Request</text>
  <text x="1005" y="225" text-anchor="middle" font-family="Arial" font-size="18">1000 / 2000 / 2000 W</text>

  <line x1="320" y1="205" x2="455" y2="205" stroke="#2878c8" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="745" y1="205" x2="880" y2="205" stroke="#2878c8" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="300" y="360" width="600" height="165" rx="22" fill="#ffffff" stroke="#7d8b99" stroke-width="3"/>
  <text x="600" y="405" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">Boiler Processor</text>
  <text x="600" y="440" text-anchor="middle" font-family="Arial" font-size="18">sensor.budget_example_boiler</text>
  <text x="600" y="470" text-anchor="middle" font-family="Arial" font-size="18">→ relay / smart plug / contactor</text>
  <text x="600" y="500" text-anchor="middle" font-family="Arial" font-size="18" fill="#526675">device-specific logic stays outside the Dispenser</text>

  <line x1="1005" y1="265" x2="760" y2="360" stroke="#2878c8" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="440" y1="360" x2="195" y2="265" stroke="#2878c8" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="70" y="555" width="1060" height="60" rx="16" fill="#eef2f6"/>
  <text x="600" y="593" text-anchor="middle" font-family="Arial" font-size="18" fill="#31495c">Minimum = hard start threshold • Preferred = valuable operating point • Maximum = hard safety limit</text>
</svg>
